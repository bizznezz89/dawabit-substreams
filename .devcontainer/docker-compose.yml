services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker-host.sock
      - ipfs-data:/data/ipfs
      - ipfs-export-data:/data/ipfs-export
      - db-data:/data/db
    entrypoint: '/bin/sh -c "sleep infinity"'
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 5

  ipfs:
    image: ipfs/kubo:v0.14.0
    volumes:
      - ipfs-data:/data/ipfs
      - ipfs-export-data:/export
    network_mode: service:main
    depends_on:
      - postgres

  graph-node:
    image: graphprotocol/graph-node:9a51f3b
    volumes:
      - ../.graph-node:/config/graph-node:cached
      - ..:/workspace:cached  # .devcontainer, .env
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: 'localhost:5001'
      GRAPH_LOG: info
      GRAPH_NODE_CONFIG: /workspace/.graph-node/config.toml
      GRAPH_STORE_WRITE_BATCH_SIZE: 0
      GRAPH_ALLOW_NON_DETERMINISTIC_FULLTEXT_SEARCH: "true"
    command:
      - /workspace/.devcontainer/wait-graph-node.sh
    depends_on:
      - ipfs
      - postgres
    network_mode: service:main
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    command:
    -  "postgres"
    -  "-cshared_preload_libraries=pg_stat_statements"
    #-  "-clog_statement=all"
    network_mode: service:main
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres-init/10-dawabit.sh:/docker-entrypoint-initdb.d/10-dawabit.sh:ro
      - ../api/sql/api-support.sql:/bootstrap/api-support.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "graph-node"]
      interval: 30s
      timeout: 10s
      retries: 15


  substreams-sink:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      main:
        condition: service_started
      postgres:
        condition: service_healthy

    environment:
      SUBSTREAMS_WORKDIR: /workspace/dawabit_substreams
      SUBSTREAMS_ENV_FILE: /workspace/dawabit_substreams/.substreams.env
      SUBSTREAMS_MANIFEST: substreams.yaml
      SUBSTREAMS_MODULE: map_market_activity
      SUBSTREAMS_ENDPOINT: mainnet.robinhood.streamingfast.io:443
      SUBSTREAMS_START_BLOCK: "66552064"
      SUBSTREAMS_SINK_DSN: postgres://graph-node:let-me-in@localhost:5432/dawabit?sslmode=disable

    entrypoint:
      - /workspace/.devcontainer/run-substreams-sink.sh

    network_mode: service:main

    volumes:
      - ..:/workspace:cached

    restart: unless-stopped


  api:
    build:
      context: ../api
      dockerfile: Dockerfile

    depends_on:
      main:
        condition: service_started
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"

      DATABASE_URL: postgres://graph-node:let-me-in@localhost:5432/dawabit?sslmode=disable
      RHC_RPC_URL: https://rpc.mainnet.chain.robinhood.com
      RELAUNCH_TRADE_ROUTER: 0x48AcF9c62384A6C15cCA80F6307cc29a5be2580B

      EXECUTION_CACHE_TTL_MS: "10000"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_GLOBAL_MAX: "120"
      RATE_LIMIT_QUOTE_MAX: "30"

    network_mode: service:main

    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb:0.11.12
    restart: on-failure
    command: ["pgweb", "--bind=0.0.0.0", "--listen=8081", "--binary-codec=hex"]
    network_mode: service:main
    environment:
      - DATABASE_URL=postgres://graph-node:let-me-in@localhost:5432/graph-node?sslmode=disable
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  ipfs-data:
  ipfs-export-data:
